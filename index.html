<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Sistema de monitoramento ativo com análise constante da estabilidade e integridade do servidor." />
  <title>Monitoramento Ativo</title>

  <!-- Fontes externas do Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="path/to/favicon.ico" />

  <style>
    /* Estilos gerais */
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Roboto', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 5vw;
      margin-bottom: 0.2em;
    }

    p {
      font-size: 2vw;
      color: #d0d7de; /* Cor mais clara para contraste */
    }

    .pulse {
      animation: pulse 2s infinite;
      color: #3fb950;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.5; transform: scale(1); }
    }

    .footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.8em;
      color: #6e7681;
      text-align: center;
    }

    .footer a {
      color: #58a6ff;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Título com animação -->
  <h1 class="pulse">▌ Sistema de Monitoramento Ativo...</h1>

  <!-- Slogan -->
  <p>Quando falha, sabemos. Quando funciona, garantimos.</p>

  <!-- Footer com link para GitHub ou outras redes -->
  <div class="footer">
    <p>Desenvolvido por <a href="https://github.com/oig04" target="_blank">Giovanna Freitas</a> — 2025</p>
  </div>
</body>
</html>
